<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="600" fill="#FFFFFF"/><rect x="40" y="40" width="270" height="120" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="60" y="62" font-size="14" font-weight="500" dominant-baseline="central" fill="#2C2C2A">PM 窗口（pi + 扩展，PM 模式）</text><rect x="60" y="80" width="230" height="30" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="2"/><text x="175" y="95" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#72243E">decision point：dp-w-type 选类型</text><rect x="60" y="118" width="230" height="30" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/><text x="175" y="133" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#3C3489">dispatch 派发 + /mw-watch 看板</text><path d="M310 100H366" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="338" y="88" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#888780">派发</text><rect x="368" y="40" width="272" height="120" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="388" y="62" font-size="14" font-weight="500" dominant-baseline="central" fill="#2C2C2A">mw serve 后台服务（Python）</text><rect x="388" y="80" width="232" height="30" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><text x="504" y="95" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">调度队列 + worker launcher</text><rect x="388" y="118" width="232" height="30" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><text x="504" y="133" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">watchdog 看门狗 + LLM 代理</text><path d="M504 160V214" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="540" y="188" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#888780">spawn 独立进程</text><rect x="368" y="216" width="272" height="158" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="388" y="238" font-size="14" font-weight="500" dominant-baseline="central" fill="#2C2C2A">Worker 1..N（独立 pi 进程）</text><rect x="388" y="256" width="232" height="30" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/><text x="504" y="271" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#085041">跑 Agent Loop：推理 + 工具</text><rect x="388" y="294" width="232" height="62" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="2"/><text x="504" y="312" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#72243E">decision point：dp-w-check-task</text><text x="504" y="336" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#993556">继续 / 终止出结论 / 有界补证</text><rect x="40" y="216" width="270" height="158" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="60" y="238" font-size="14" font-weight="500" dominant-baseline="central" fill="#2C2C2A">.agenticdoc/ 文件协调层</text><text x="60" y="270" font-size="12" dominant-baseline="central" fill="#5F5E5A">task.md → trace.log</text><text x="60" y="292" font-size="12" dominant-baseline="central" fill="#5F5E5A">→ output.md → _index.parallel</text><text x="60" y="324" font-size="12" dominant-baseline="central" fill="#5F5E5A">文件锁做并发控制，无中心内存</text><text x="60" y="346" font-size="12" dominant-baseline="central" fill="#5F5E5A">终态：完成 / 未完成 / 阻断及证据</text><path d="M368 295H312" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="283" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#888780">读写</text><path d="M175 160V214" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="212" y="188" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#888780">轮询</text><path d="M175 374V430" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="185" y="402" font-size="12" dominant-baseline="central" fill="#888780">终态结论，Worker 不等待</text><rect x="40" y="432" width="600" height="72" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="340" y="456" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#085041">PM 吸收终态，按需组织后续</text><text x="340" y="482" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">dp-pm-steer 编排 / dp-auto 现场行动 → advance_phase 推进 phase，回到下一 tick</text><rect x="268" y="540" width="14" height="14" rx="3" fill="#FBEAF0" stroke="#D4537E" stroke-width="2"/><text x="290" y="547" font-size="12" dominant-baseline="central" fill="#5F5E5A">decision point</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="440" fill="#FFFFFF"/><rect x="40" y="40" width="330" height="150" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="60" y="64" font-size="14" font-weight="500" dominant-baseline="central" fill="#3C3489">Autopilot · 编排外循环</text><text x="60" y="88" font-size="12" dominant-baseline="central" fill="#534AB7">一个 tick（约 4s） · PM + mw serve</text><text x="60" y="122" font-size="13" dominant-baseline="central" fill="#3C3489">按依赖前沿派发 key</text><text x="60" y="146" font-size="13" dominant-baseline="central" fill="#3C3489">gate 事项 · 停滞检测</text><text x="60" y="170" font-size="13" dominant-baseline="central" fill="#3C3489">roadmap / timeline 留痕</text><rect x="40" y="250" width="330" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="60" y="274" font-size="14" font-weight="500" dominant-baseline="central" fill="#085041">Agent Loop · 单进程内循环</text><text x="60" y="298" font-size="12" dominant-baseline="central" fill="#0F6E56">一次 LLM 调用 + 一批工具 · Worker</text><text x="60" y="332" font-size="13" dominant-baseline="central" fill="#085041">流式响应 → 执行工具</text><text x="60" y="356" font-size="13" dominant-baseline="central" fill="#085041">结果回流 → 下一轮</text><text x="60" y="380" font-size="13" dominant-baseline="central" fill="#085041">steering / followUp 注入</text><path d="M160 190V248" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/><text x="152" y="219" font-size="12" text-anchor="end" dominant-baseline="central" fill="#5F5E5A">派发 Worker</text><path d="M250 248V192" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/><text x="258" y="219" font-size="12" dominant-baseline="central" fill="#5F5E5A">终态结论</text><rect x="450" y="40" width="190" height="360" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="470" y="64" font-size="14" font-weight="500" dominant-baseline="central" fill="#0C447C">Decide · 决策入口</text><text x="470" y="88" font-size="12" dominant-baseline="central" fill="#185FA5">只选择，不执行</text><text x="470" y="120" font-size="12" dominant-baseline="central" fill="#5F5E5A">PM 发起</text><text x="482" y="144" font-size="13" dominant-baseline="central" fill="#0C447C">dp-w-type</text><text x="482" y="166" font-size="13" dominant-baseline="central" fill="#0C447C">dp-pm-steer</text><text x="482" y="188" font-size="13" dominant-baseline="central" fill="#0C447C">dp-QG</text><text x="482" y="210" font-size="13" dominant-baseline="central" fill="#0C447C">dp-gate-approve</text><text x="482" y="232" font-size="13" dominant-baseline="central" fill="#0C447C">dp-sign-key</text><text x="482" y="254" font-size="13" dominant-baseline="central" fill="#0C447C">dp-auto</text><text x="470" y="290" font-size="12" dominant-baseline="central" fill="#5F5E5A">Worker 发起</text><text x="482" y="314" font-size="13" dominant-baseline="central" fill="#0C447C">dp-w-check-task</text><line x1="470" y1="340" x2="620" y2="340" stroke="#85B7EB" stroke-width="0.5"/><text x="470" y="364" font-size="13" dominant-baseline="central" fill="#0C447C">dp-route</text><text x="470" y="384" font-size="11" dominant-baseline="central" fill="#5F5E5A">临时问题先选入口</text><path d="M370 100H448" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/><text x="409" y="88" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">请求</text><path d="M448 140H372" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/><text x="409" y="152" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">合法选择</text><path d="M370 300H448" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/><text x="409" y="288" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">自查</text><path d="M448 340H372" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/><text x="409" y="352" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">合法选择</text><text x="340" y="424" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">三层只经 .agenticdoc/ 文件衔接，不共享进程内存</text></svg>
